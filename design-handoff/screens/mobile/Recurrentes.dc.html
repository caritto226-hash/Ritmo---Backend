<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Pagos recurrentes</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#121212;text-decoration:none}a:hover{color:#000000}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; isolation: isolate; overflow: hidden; background: #F7F7F8; font-family: Urbanist, system-ui, sans-serif; color: #121212; box-sizing: border-box; padding: 16px 20px; display: flex; flex-direction: column; gap: 18px">

<div style="display: flex; align-items: center; gap: 4px">
<a href="Finanzas.dc.html" aria-label="Volver" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></a>
<h1 style="margin: 0; font-size: 30px; font-weight: 400; letter-spacing: -0.6px; flex: 1">Recurrentes</h1>
<button type="button" aria-label="Nuevo recurrente" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #121212; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
</div>

<div role="tablist" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); background: #ECEDEF; border: none; border-radius: 16px; padding: 4px; gap: 4px">
<button type="button" role="tab" aria-selected="{{onPend}}" onClick="{{showPend}}" style="height: 40px; border-radius: 12px; border: none; background: {{pendBg}}; color: #121212; font-family: inherit; font-size: 14px; font-weight: 600">Por confirmar · 2</button>
<button type="button" role="tab" aria-selected="{{onDone}}" onClick="{{showDone}}" style="height: 40px; border-radius: 12px; border: none; background: {{doneBg}}; color: #121212; font-family: inherit; font-size: 14px; font-weight: 600">Al día · 1</button>
</div>

<sc-if value="{{onPend}}" hint-placeholder-val="{{ true }}">
<div style="background: #FFFFFF; border: none; box-shadow: none; border-radius: 18px; padding: 0 14px">
<a href="Confirmar.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid #F1F2F4; color: #121212">
<span style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 12px; background: #F1F9C4; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#121212" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V21H3z"/><path d="M9 21v-6h6v6"/></svg></span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 500">Arriendo</span><span style="font-size: 12px; color: #121212; font-weight: 500">Vence mañana</span></span>
<span style="font-size: 15px; font-weight: 600">$650.000</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6268" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
</a>
<a href="Confirmar.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 0; color: #121212">
<span style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 12px; background: #DDEFE6; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2E7D4F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg></span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 500">Freelance web</span><span style="font-size: 12px; color: #121212; font-weight: 500">Hoy</span></span>
<span style="font-size: 15px; font-weight: 600; color: #2E7D4F">$1.200.000</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6268" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
</a>
</div>
</sc-if>

<sc-if value="{{onDone}}" hint-placeholder-val="{{ false }}">
<div style="background: #FFFFFF; border: none; box-shadow: none; border-radius: 18px; padding: 0 14px">
<div style="display: flex; align-items: center; gap: 12px; padding: 12px 0">
<span style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 12px; background: #F1F9C4; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#121212" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10h18L12 4z"/><path d="M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 20h18"/></svg></span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 500">Tarjeta</span><span style="font-size: 12px; color: #5F6268">Pagada 28 oct · próxima 28 nov</span></span>
<span style="font-size: 15px; font-weight: 600">$800.000</span>
</div>
</div>
</sc-if>

<p style="margin: 0; font-size: 13px; color: #5F6268; display: flex; gap: 8px; align-items: flex-start"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 2px"><circle cx="12" cy="12" r="9"/><path d="M12 8v.01M12 11v5"/></svg>Aparecen 2 días antes de su fecha. Toca uno para confirmarlo, detenerlo o eliminarlo.</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { tab: 'pend' }; }
renderVals() {
const pend = this.state.tab === 'pend';
return {
onPend: pend, onDone: !pend,
pendBg: pend ? '#FFFFFF' : 'transparent',
doneBg: pend ? 'transparent' : '#FFFFFF',
showPend: () => this.setState({ tab: 'pend' }),
showDone: () => this.setState({ tab: 'done' })
};
}
}
</script>
</body>
</html>
