<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Ritmo Hábitos</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#121212;text-decoration:none}a:hover{color:#000}
.hs::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; isolation: isolate; overflow: hidden; background: #F7F7F8; font-family: Urbanist, system-ui, sans-serif; color: #121212">
<div class="hs" style="height: 768px; overflow-y: auto; box-sizing: border-box; padding: 16px 20px 24px; display: flex; flex-direction: column; gap: 18px">

<div style="display: flex; align-items: center; gap: 10px">
<button type="button" aria-label="Menú" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #ECEDEF; border: none; color: #121212; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 14px rgba(18,18,18,0.06)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
<span style="flex: 1"></span>
<button type="button" aria-label="Nuevo hábito" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #121212; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
<button type="button" aria-label="Notificaciones, 1 nueva" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #ECEDEF; color: #121212; display: flex; align-items: center; justify-content: center; position: relative"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span style="position: absolute; top: 9px; right: 10px; width: 8px; height: 8px; border-radius: 4px; background: #E5484D"></span></button>
</div>

<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<div style="display: flex; flex-direction: column">
<h1 style="margin: 0; font-size: 30px; font-weight: 400; letter-spacing: -0.6px">Mis hábitos</h1>
<span style="font-size: 13px; color: #5F6268">{{doneCount}} de 4 cumplidos hoy</span>
</div>
<button type="button" style="height: 48px; padding: 0 16px 0 6px; border-radius: 24px; border: none; background: #ECEDEF; display: flex; align-items: center; gap: 10px; font-family: inherit; font-size: 14px; font-weight: 500; color: #121212"><span style="width: 36px; height: 36px; border-radius: 18px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></span>Progreso</button>
</div>

<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; text-align: center">
<sc-for list="{{week}}" as="d" hint-placeholder-count="7">
<button type="button" aria-label="{{d.aria}}" style="border: none; background: transparent; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; font-family: inherit; color: #121212">
<span style="font-size: 13px; font-weight: 500; color: #5F6268">{{d.l}}</span>
<span style="width: 44px; height: 44px; position: relative; display: flex; align-items: center; justify-content: center">
<svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true" style="position: absolute; inset: 0; transform: rotate(-90deg)"><circle cx="22" cy="22" r="20" fill="{{d.fill}}" stroke="#ECEDEF" stroke-width="3"/><circle cx="22" cy="22" r="20" fill="none" stroke="#121212" stroke-width="3" stroke-linecap="round" stroke-dasharray="{{d.dash}} 126"/></svg>
<span style="position: relative; font-size: 15px; font-weight: 500; color: {{d.fg}}">{{d.n}}</span>
</span>
</button>
</sc-for>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">

<div style="position: relative; overflow: hidden; height: 76px; border-radius: 28px; background-color: {{a.base}}; color: {{a.fg}}; border: 1px solid rgba(255,255,255,0.55); backdrop-filter: blur(14px); box-shadow: 0 6px 18px rgba(18,18,18,0.07)">
<div aria-hidden="true" style="position: absolute; left: 0; top: 0; bottom: 0; width: {{a.pct}}%; background-color: {{a.fill}}; background-image: {{a.stripes}}"></div>
<div style="position: relative; height: 76px; box-sizing: border-box; padding: 0 8px 0 14px; display: flex; align-items: center; gap: 12px">
<span style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; background: rgba(255,255,255,0.6); display: flex; align-items: center; justify-content: center; color: #121212"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.7S5 10 5 14.5a7 7 0 0 0 14 0C19 10 12 2.7 12 2.7Z"/></svg></span>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 500">Tomar agua</span><span style="font-size: 12px; font-weight: 600; opacity: 0.85">{{a.meta}}</span></div>
<span style="font-size: 15px; font-weight: 600">{{a.count}}/8</span>
<button type="button" aria-label="{{a.aria}}" onClick="{{a.act}}" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; border: none; background: #121212; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><sc-if value="{{a.done}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></sc-if><sc-if value="{{a.notDone}}" hint-placeholder-val="{{ true }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></sc-if></button>
</div>
</div>

<div style="position: relative; overflow: hidden; height: 76px; border-radius: 28px; background-color: {{b.base}}; background-image: {{b.stripes}}; color: {{b.fg}}; border: 1px solid rgba(255,255,255,0.55); backdrop-filter: blur(14px); box-shadow: 0 6px 18px rgba(18,18,18,0.07)">
<div style="position: relative; height: 76px; box-sizing: border-box; padding: 0 8px 0 14px; display: flex; align-items: center; gap: 12px">
<span style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; background: rgba(255,255,255,0.6); display: flex; align-items: center; justify-content: center; color: #121212"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/></svg></span>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 500">Leer 20 minutos</span><span style="font-size: 12px; font-weight: 600; opacity: 0.85">{{b.meta}}</span></div>
<button type="button" aria-pressed="{{b.done}}" aria-label="{{b.aria}}" onClick="{{b.act}}" style="width: 44px; height: 44px; flex-shrink: 0; border: none; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center"><span style="width: 32px; height: 32px; border-radius: 16px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: {{b.checkBg}}; border: 1.5px solid {{b.checkBorder}}"><sc-if value="{{b.done}}" hint-placeholder-val="{{ true }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></sc-if></span></button>
</div>
</div>

<div style="position: relative; overflow: hidden; height: 76px; border-radius: 28px; background-color: {{c.base}}; background-image: {{c.stripes}}; color: {{c.fg}}; border: 1px solid rgba(255,255,255,0.35); backdrop-filter: blur(14px); box-shadow: 0 6px 18px rgba(18,18,18,0.07)">
<div style="position: relative; height: 76px; box-sizing: border-box; padding: 0 8px 0 14px; display: flex; align-items: center; gap: 12px">
<span style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; background: rgba(255,255,255,0.6); display: flex; align-items: center; justify-content: center; color: #121212"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="13" cy="4" r="2"/><path d="m9 21 2-6 3 3v3M7 12l3-3 4 1 3 3M11 15l-1-4"/></svg></span>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 500">Caminar 30 minutos</span><span style="font-size: 12px; font-weight: 600; opacity: 0.85">{{c.meta}}</span></div>
<button type="button" aria-pressed="{{c.done}}" aria-label="{{c.aria}}" onClick="{{c.act}}" style="width: 44px; height: 44px; flex-shrink: 0; border: none; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center"><span style="width: 32px; height: 32px; border-radius: 16px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: {{c.checkBg}}; border: 1.5px solid {{c.checkBorder}}"><sc-if value="{{c.done}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></sc-if></span></button>
</div>
</div>

<div style="position: relative; overflow: hidden; height: 76px; border-radius: 28px; background-color: {{d.base}}; background-image: {{d.stripes}}; color: {{d.fg}}; border: 1px solid rgba(255,255,255,0.55); backdrop-filter: blur(14px); box-shadow: 0 6px 18px rgba(18,18,18,0.07)">
<div style="position: relative; height: 76px; box-sizing: border-box; padding: 0 8px 0 14px; display: flex; align-items: center; gap: 12px">
<span style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; background: rgba(255,255,255,0.6); display: flex; align-items: center; justify-content: center; color: #121212"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg></span>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 500">Dormir antes de las 11 p. m.</span><span style="font-size: 12px; font-weight: 600; opacity: 0.85">{{d.meta}}</span></div>
<button type="button" aria-pressed="{{d.done}}" aria-label="{{d.aria}}" onClick="{{d.act}}" style="width: 44px; height: 44px; flex-shrink: 0; border: none; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center"><span style="width: 32px; height: 32px; border-radius: 16px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: {{d.checkBg}}; border: 1.5px solid {{d.checkBorder}}"><sc-if value="{{d.done}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></sc-if></span></button>
</div>
</div>

</div>

<div style="display: flex; align-items: center; gap: 12px; background-color: #121212; background-image: linear-gradient(135deg, rgba(255,255,255,0.14), rgba(255,255,255,0) 55%); border: 1px solid rgba(255,255,255,0.14); box-shadow: 0 14px 32px rgba(17,17,20,0.18), inset 0 1px 0 rgba(255,255,255,0.18); color: #FFFFFF; border-radius: 24px; padding: 12px 12px 12px 14px">
<span style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; background: #E4DEFB; color: #121212; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg></span>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-size: 12px; font-weight: 500; opacity: 0.8">Próximo recordatorio</span><span style="font-size: 15px; font-weight: 500">Tomar agua · 1:00 p. m.</span></div>
<button type="button" style="height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid rgba(255,255,255,0.4); background: transparent; color: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 500">Editar</button>
</div>

</div>

<nav aria-label="Principal" style="position: absolute; left: 12px; right: 12px; bottom: 10px; height: 64px; background: #FFFFFF; border: none; border-radius: 22px; box-shadow: 0 10px 30px rgba(18,18,18,0.10); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; padding: 0 6px">

<a href="Habitos.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; font-weight: 600; color: #121212"><span style="width: 44px; height: 28px; border-radius: 14px; background: #EAF98F; color: #121212; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span>Hábitos</a>

</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const PAL = {
  lime: { base: 'rgba(185,222,205,0.9)', fg: '#121212', line: 'rgba(18,18,18,0.2)' },
  purple: { base: 'rgba(142,208,205,0.82)', fg: '#121212', line: 'rgba(18,18,18,0.2)' },
  black: { base: 'rgba(234,249,143,0.9)', fg: '#121212', line: 'rgba(18,18,18,0.2)' },
  grey: { base: 'rgba(220,224,235,0.92)', fg: '#121212', line: 'rgba(18,18,18,0.2)' }
};
const DONE = { base: 'rgba(241,242,244,0.85)', fg: '#5F6268', line: 'rgba(18,18,18,0.14)' };
const STRIPES = 'repeating-linear-gradient(135deg, rgba(255,255,255,0.35) 0 2px, transparent 2px 9px)';
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { water: 4, b: true, c: false, d: false }; }
  bin(key, cat, meta, name) {
    const done = this.state[key], k = done ? DONE : PAL[cat];
    return { done, base: k.base, fg: k.fg, stripes: done ? 'none' : STRIPES,
      checkBg: done ? '#121212' : 'transparent', checkBorder: done ? '#121212' : k.line,
      meta: done ? 'Cumplido hoy' : meta, aria: (done ? 'Desmarcar: ' : 'Marcar cumplido: ') + name,
      act: () => this.setState({ [key]: !this.state[key] }) };
  }
  renderVals() {
    const w = this.state.water, wDone = w >= 8;
    const a = { count: w, done: wDone, notDone: !wDone, pct: wDone ? 0 : Math.round(w / 8 * 100),
      base: wDone ? DONE.base : 'rgba(142,208,205,0.28)', fill: 'rgba(142,208,205,0.9)', stripes: STRIPES,
      fg: wDone ? DONE.fg : '#121212', meta: wDone ? 'Cumplido hoy' : 'Un vaso cada 3 h',
      aria: wDone ? 'Quitar un vaso' : 'Sumar un vaso de agua',
      act: () => this.setState({ water: wDone ? 7 : w + 1 }) };
    const b = this.bin('b', 'purple', 'Diario', 'Leer 20 minutos');
    const c = this.bin('c', 'black', 'Lunes a viernes', 'Caminar 30 minutos');
    const d = this.bin('d', 'grey', 'Diario', 'Dormir antes de las 11 p. m.');
    const doneCount = [wDone, b.done, c.done, d.done].filter(Boolean).length;
    const L = ['D', 'L', 'M', 'M', 'J', 'V', 'S'], past = [1, 0.75, 0.5];
    const week = L.map((l, i) => { const n = 25 + i, today = n === 28;
      const p = today ? doneCount / 4 : (i < 3 ? past[i] : 0);
      return { l, n, aria: l + ' ' + n + ', ' + Math.round(p * 100) + '% cumplido', dash: (p * 125.7).toFixed(1), fill: today ? '#121212' : 'transparent', fg: today ? '#FFFFFF' : '#121212' }; });
    return { a, b, c, d, doneCount, week };
  }
}
</script>
